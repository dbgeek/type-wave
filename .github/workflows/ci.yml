# Release CI gate — the "green build + full headless test suite before release"
# precondition for map #109 (automate GitHub releases).
#
# Decisions (ticket #115, grounded in research #110 → docs/research/ci-macos-arm64.md):
#   • Runner:        macos-15 (arm64 / M1), pinned — free & unlimited on this public repo.
#   • Toolchain:     nightly Zig + cmake/ninja/python3/mypy, reproduced from the Nix flake
#                    (flake.lock is the real lock) via DeterminateSystems/nix-installer-action
#                    + `nix develop` — NOT setup-zig (which pins only Zig and drifts).
#   • Gate scope:    `zig build test` — the whole headless suite: Zig unit tests
#                    (Coordinator lifecycle + pure fns) + acceptance/local_backend unittests
#                    + `mypy --strict` + packaging/test_packaging.py. Source-only releases
#                    attach no binary, so the ~4–8 min Metal whisper-helper compile is NOT
#                    part of this gate.
#   • Cache:         magic-nix-cache (free, revived 2025) for the Nix store, plus ~/.cache/zig
#                    (the single biggest wall-clock lever — memoizes Zig + the whisper build).
#
# The `test` job name is the required status-check context on `main` (branch protection).
#
# Change gating (pull_request only): the job ALWAYS runs so the required `test` context is
# always posted — otherwise a path-filtered workflow would never report and branch
# protection would block the merge forever. Instead the gate switch decides whether to run
# the expensive Nix + `zig build test` steps. push(main)/workflow_dispatch always run the
# full gate.
#
# The switch is a SKIPLIST, not a run list, and that direction is the point (ticket #258).
# It used to run only on `**/*.zig` + `build.zig.zon`, which meant every non-Zig change —
# the installer, the tooling scripts, the acceptance gate, the flake inputs, these workflow
# files — merged behind a required check that reported green without having run. The
# sharpest case: `tools/build-whisper-runtime.sh` carries the size + SHA-256 verification of
# the whisper.cpp tarball, so an edit weakening the one thing standing between a substituted
# upstream archive and our build was not a Zig change and so was never tested.
#
# So the gate now runs by default and skips only for paths nothing in the build or the suite
# reads. A directory nobody remembered to classify is substantive, and runs — the switch
# fails toward running the gate, never toward a green skip. Everything that can go wrong here
# (an unreadable file list, an API failure) fails the job, which blocks the merge, rather than
# reporting the fast green.
#
# The changed-file list comes straight from the PR API rather than a third-party filter
# action, so the decision to skip the release gate depends on nothing outside this file.
#
# Every `uses:` here — and in every workflow — is pinned to a full commit SHA with the
# release in a trailing comment (ticket #292). A tag or a branch is a name its author can
# re-point, so an unpinned action decides what runs on this runner tomorrow with no change
# on our side. `.github/dependabot.yml` advances the pins by reviewed PR;
# PackagingTests.test_every_action_is_pinned_to_a_commit fails if a new one arrives unpinned.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref; new pushes cancel superseded runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read the tree, plus PR file lists for the change filter.
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Single gate switch: run the full suite unless every file this PR touches is inert.
      - name: Decide whether to run the gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Paths nothing in the build or the test suite reads. Extend this only for files
          # that are provably inert — anything not listed here runs the gate.
          INERT='(^docs/|^assets/|^\.claude/|^LICENSE$|\.md$)'

          # …except the docs the suite actually asserts on, which gate like source. Kept
          # honest from the other end by PackagingTests.test_gate_covers_the_docs_this_suite_reads.
          GATE_INPUT_DOCS='^docs/packaging\.md$'

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `set -e` makes an API failure fail the job — a merge blocked on a red required
          # check, never a merge waved through on a green one.
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')"

          if [ -z "$files" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Could not read this PR's changed files — running the full gate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          substantive="$(
            { printf '%s\n' "$files" | grep -Ev "$INERT" || true
              printf '%s\n' "$files" | grep -E "$GATE_INPUT_DOCS" || true
            } | sort -u
          )"

          if [ -n "$substantive" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            {
              echo "Running the full gate — these changed files are not inert:"
              echo
              printf '%s\n' "$substantive" | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Every file in this PR is inert (docs, assets, agent config) — skipping the build/test gate." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Reproduce the exact pinned dev shell (Zig + cmake/ninja/python3/mypy) from flake.lock.
      - name: Install Nix
        if: steps.gate.outputs.run == 'true'
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Free, ephemeral Nix-store speed cache (GitHub Actions cache backed).
      - name: Magic Nix Cache
        if: steps.gate.outputs.run == 'true'
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      # Zig global cache — memoizes compilation and the whisper Metal build output.
      # Keyed on the toolchain/build inputs; falls back to the newest partial match.
      - name: Cache ~/.cache/zig
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zig
          key: zig-cache-${{ runner.os }}-${{ hashFiles('flake.lock', 'build.zig.zon', 'build.zig', 'tools/build-whisper-runtime.sh') }}-${{ github.sha }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ hashFiles('flake.lock', 'build.zig.zon', 'build.zig', 'tools/build-whisper-runtime.sh') }}-
            zig-cache-${{ runner.os }}-

      # The release gate: the full headless test suite, run inside the pinned dev shell.
      - name: zig build test
        if: steps.gate.outputs.run == 'true'
        run: nix develop --command zig build test
